[package]
name = "omnia-tauri"
version = "0.11.3"
edition = "2021"
rust-version = "1.98"
license = "MIT"

# Keep development builds fast; optimize shipped binaries for size. Preserve
# panic unwinding so this does not change error/cleanup behavior.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
[dependencies]
tauri = { version = "=2.12.4", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["sync", "time", "macros"] }


reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
rand = "0.8"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
tempfile = "3"
open = "5"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-autostart = "=2.7.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = "=0.62.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
gtk = "=0.18.2"
javascriptcore-rs = "=1.1.2"
