name: Verify and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run crap
      - run: npm run build
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libxdo-dev build-essential pkg-config xvfb gnome-keyring
      - run: npm ci
      - run: npm run build
      - run: npm run native:check
      - run: npm run native:test
      - run: npm run native:lint
      - if: runner.os == 'Linux'
        name: WebKitGTK smoke in disposable Xvfb and Secret Service session
        env:
          GDK_BACKEND: x11
          OMNIA_SMOKE_DISPLAY: Xvfb CI virtual display
        run: |
          xvfb-run -a dbus-run-session -- bash -euc '
            printf "%s" omnia-ci-fixture | gnome-keyring-daemon --unlock --components=secrets
            npm run smoke:linux
          '
      - run: npm run native:build
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omnia-Linux-native-evidence
          path: reports/native-linux.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: omnia-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
