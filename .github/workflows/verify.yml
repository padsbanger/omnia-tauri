name: Verify and build
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and attach installers to (blank = verify only)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.release.tag_name || inputs.release_tag) && format('refs/tags/{0}', github.event.release.tag_name || inputs.release_tag) || github.ref }}
      - name: Resolve source and validate release
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            git check-ref-format "refs/tags/$RELEASE_TAG"
            test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          fi
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          versions = [json.loads(Path(p).read_text())['version'] for p in ['package.json', 'src-tauri/tauri.conf.json']]
          versions.append(tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version'])
          version = versions[0]
          if not isinstance(version, str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid app version for artifact naming')
          if any(v != version for v in versions):
              raise SystemExit(f'Package, Tauri and Cargo versions must match: {versions}')
          tag = os.environ['RELEASE_TAG']
          if tag and tag.removeprefix('v') != version:
              raise SystemExit(f'Release tag must match app version: {version}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
          PY
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  frontend:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run crap
      - run: npm run build
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libxdo-dev build-essential pkg-config xvfb gnome-keyring
      - run: npm ci
      - run: npm run build
      - run: npm run native:check
      - run: npm run native:test
      - run: npm run native:lint
      - if: runner.os == 'Linux'
        name: WebKitGTK smoke in disposable Xvfb and Secret Service session
        env:
          GDK_BACKEND: x11
          OMNIA_SMOKE_DISPLAY: Xvfb CI virtual display
        run: |
          xvfb-run -a dbus-run-session -- bash -euc '
            printf "%s" omnia-ci-fixture | gnome-keyring-daemon --unlock --components=secrets
            npm run smoke:linux
          '
      - run: npm run native:build
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omnia-${{ needs.prepare.outputs.version }}-Linux-native-evidence
          path: reports/native-linux.json
          if-no-files-found: warn
      # Upload installers only, never AppDir or other unpacked staging trees.
      # Each Linux format is separate so users download only the one they need.
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omnia-${{ needs.prepare.outputs.version }}-Linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omnia-${{ needs.prepare.outputs.version }}-Linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omnia-${{ needs.prepare.outputs.version }}-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omnia-${{ needs.prepare.outputs.version }}-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  release-assets:
    name: Attach installers to release
    needs: [prepare, frontend, native]
    if: needs.prepare.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omnia-${{ needs.prepare.outputs.version }}-*
          path: release-assets
      - name: Upload installers to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          # Do not attach evidence JSON, CI ZIP wrappers or staging directories.
          mapfile -d '' -t assets < <(find release-assets -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -print0)
          test "${#assets[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
